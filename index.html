<!DOCTYPE html>
<html>
<head>
  <title>Image Filter App</title>
</head>
<body>
  <h1>AI Image Filter App</h1>

  <input type="file" id="upload">
  <br><br>

  <button onclick="applyGrayscale()">グレースケール</button>
  <button onclick="applyInvert()">反転</button>
  <button onclick="resetImage()">リセット</button>

  <br><br>

  明るさ: <input type="range" id="brightness" min="-100" max="100" value="0">

  <br><br>
  <canvas id="canvas"></canvas>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const brightnessSlider = document.getElementById('brightness');

    let originalImage = null;

    // スライダー操作
    brightnessSlider.addEventListener('input', function() {
      applyBrightness(this.value);
    });

    // 画像アップロード
    upload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }
    });

    // グレースケール
    function applyGrayscale() {
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i+1] + data[i+2]) / 3;
        data[i] = avg;
        data[i+1] = avg;
        data[i+2] = avg;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    // 反転
    function applyInvert() {
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        data[i] = 255 - data[i];
        data[i+1] = 255 - data[i+1];
        data[i+2] = 255 - data[i+2];
      }

      ctx.putImageData(imageData, 0, 0);
    }

    // 明るさ調整
    function applyBrightness(value) {
      if (!originalImage) return;

      let imageData = new ImageData(
        new Uint8ClampedArray(originalImage.data),
        originalImage.width,
        originalImage.height
      );

      let data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        data[i] += Number(value);
        data[i+1] += Number(value);
        data[i+2] += Number(value);
      }

      ctx.putImageData(imageData, 0, 0);
    }

    // リセット
    function resetImage() {
      if (originalImage) {
        ctx.putImageData(originalImage, 0, 0);
        brightnessSlider.value = 0;
      }
    }
  </script>
</body>
</html>
